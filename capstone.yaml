project:
  name: Usage Metering & Billing Engine
  lane: Python/FastAPI
  payment_provider: mocked-stripe
  database: sqlite
run: uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python -m app.seed
test: pytest -q
base_url: http://127.0.0.1:8000
endpoints:
  - GET /health
  - POST /tenants
  - POST /generate
  - GET /tenants/{tenant_id}
  - GET /tenants/{tenant_id}/usage
  - POST /billing/checkout
  - POST /webhooks/stripe
